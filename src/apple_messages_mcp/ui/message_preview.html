<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Apple Messages — Message Preview</title>
<!--
  MCP App (SEP-1865) for the Apple Messages connector.

  Claude renders this document in a sandboxed iframe when one of the read
  tools runs (list_chats, get_chat_messages, search_messages, get_message).
  The host speaks JSON-RPC 2.0 over window.postMessage; we do the handshake
  by hand (no SDK) so the file stays a single self-contained HTML document
  that satisfies the restrictive default CSP:

      default-src 'none'; script-src 'self' 'unsafe-inline';
      style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'none'

  Nothing here loads from the network. Message text is inserted as text, never
  as markup. The card chrome (tokens, header, footer, states) mirrors the
  Apple Mail connector's email_preview.html so the two read as one family.
-->
<style>
  :root {
    /* Fallbacks for every host variable we rely on (spec: Views must
       degrade gracefully when the host omits `styles`). Same set and values
       as the Mail card. */
    --color-background-primary: light-dark(#ffffff, #1f1f1f);
    --color-background-secondary: light-dark(#f5f5f4, #2a2a2a);
    --color-background-tertiary: light-dark(#ebebea, #343434);
    --color-background-info: light-dark(#e8f1fb, #1d2b3a);
    --color-background-danger: light-dark(#fdecec, #3a1f1f);
    --color-text-primary: light-dark(#1a1a1a, #f2f2f2);
    --color-text-secondary: light-dark(#5c5c5c, #b3b3b3);
    --color-text-tertiary: light-dark(#8a8a8a, #8a8a8a);
    --color-text-info: light-dark(#1d5fa8, #8ab8ee);
    --color-text-danger: light-dark(#b42318, #f39a92);
    --color-border-primary: light-dark(#e2e2e0, #3a3a3a);
    --color-border-secondary: light-dark(#ececeb, #333333);
    --color-ring-primary: light-dark(#1d5fa8, #8ab8ee);
    --font-sans: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
    --font-mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    --font-weight-normal: 400;
    --font-weight-medium: 500;
    --font-weight-semibold: 600;
    --font-text-xs-size: 11px;
    --font-text-sm-size: 12.5px;
    --font-text-md-size: 14px;
    --font-text-lg-size: 16px;
    --font-heading-sm-size: 17px;
    --border-radius-sm: 6px;
    --border-radius-md: 10px;
    --border-radius-lg: 14px;
    --border-radius-full: 9999px;
    --shadow-sm: 0 1px 2px rgba(0, 0, 0, 0.06);
    color-scheme: light dark;

    /* Messages.app bubble colours. */
    --bubble-imessage: light-dark(#1a84ff, #1d7dff);
    --bubble-sms: light-dark(#34c759, #30d158);
    --bubble-in: light-dark(#e9e9eb, #3b3b3d);
    --bubble-in-text: light-dark(#1a1a1a, #f2f2f2);
    --mark: light-dark(rgba(255, 214, 10, .55), rgba(255, 214, 10, .35));
  }
  :root[data-theme="light"] { color-scheme: light; }
  :root[data-theme="dark"]  { color-scheme: dark; }

  html, body { margin: 0; padding: 0; background: transparent; }
  body {
    font-family: var(--font-sans);
    font-size: var(--font-text-md-size);
    line-height: 1.45;
    color: var(--color-text-primary);
    -webkit-font-smoothing: antialiased;
  }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }

  .card {
    background: var(--color-background-primary);
    border: 1px solid var(--color-border-primary);
    border-radius: var(--border-radius-lg);
    overflow: hidden;
  }
  :root[data-host-border="true"] .card { border: none; border-radius: 0; }

  /* ---- Header ------------------------------------------------------- */
  .hdr {
    display: flex; gap: 12px; align-items: center;
    padding: 12px 16px;
  }
  .avatar {
    flex: 0 0 40px; width: 40px; height: 40px; border-radius: var(--border-radius-full);
    display: grid; place-items: center;
    color: #fff; font-weight: var(--font-weight-semibold); font-size: 15px;
    letter-spacing: 0.02em; user-select: none;
    background: var(--avatar-bg, #6b7280);
  }
  .avatar svg { width: 20px; height: 20px; }
  .avatar.me { background: #2f6fed; }
  .avatar.neutral { background: var(--color-background-tertiary); color: var(--color-text-secondary); }
  .who { flex: 1 1 auto; min-width: 0; }
  .title {
    font-weight: var(--font-weight-semibold); font-size: var(--font-text-md-size);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .sub {
    color: var(--color-text-secondary); font-size: var(--font-text-sm-size);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 1px;
  }
  .meta { flex: 0 0 auto; text-align: right; display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
  .date { color: var(--color-text-secondary); font-size: var(--font-text-sm-size); white-space: nowrap; }
  .tag {
    font-size: var(--font-text-xs-size); font-weight: var(--font-weight-semibold); letter-spacing: .02em;
    padding: 1px 7px; border-radius: var(--border-radius-full);
    color: #fff; background: var(--bubble-imessage);
  }
  .tag.sms, .tag.rcs { background: var(--bubble-sms); }

  /* ---- Body --------------------------------------------------------- */
  .body-wrap { position: relative; border-top: 1px solid var(--color-border-secondary); }
  .body { max-height: 440px; overflow: hidden; }
  .body.expanded { max-height: none; }
  .body-wrap.overflows:not(.expanded-wrap)::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 64px;
    pointer-events: none;
    background: linear-gradient(to bottom, transparent, var(--color-background-primary));
  }

  /* ---- Transcript --------------------------------------------------- */
  .transcript { padding: 10px 16px 6px; display: flex; flex-direction: column; }
  .day {
    align-self: center; margin: 6px 0 10px;
    font-size: var(--font-text-xs-size); font-weight: var(--font-weight-semibold); color: var(--color-text-tertiary);
  }
  .day b { font-weight: var(--font-weight-semibold); color: var(--color-text-secondary); }
  .msg { display: flex; flex-direction: column; max-width: 78%; margin-bottom: 2px; }
  .msg.in  { align-self: flex-start; align-items: flex-start; }
  .msg.out { align-self: flex-end;   align-items: flex-end; }
  .msg.gap { margin-top: 8px; }
  .sender { font-size: var(--font-text-xs-size); color: var(--color-text-tertiary); margin: 0 0 2px 12px; }
  .bubble {
    padding: 6px 11px 7px; border-radius: 18px;
    font-size: var(--font-text-md-size); line-height: 1.32; overflow-wrap: anywhere; white-space: pre-wrap;
  }
  .in  .bubble { background: var(--bubble-in); color: var(--bubble-in-text); border-bottom-left-radius: 6px; }
  .out .bubble { background: var(--bubble-imessage); color: #fff; border-bottom-right-radius: 6px; }
  .out.sms .bubble, .out.rcs .bubble { background: var(--bubble-sms); }
  .msg.last.in  .bubble { border-bottom-left-radius: 18px; }
  .msg.last.out .bubble { border-bottom-right-radius: 18px; }
  .bubble.unsent { font-style: italic; opacity: .75; }
  .out .bubble mark { color: inherit; background: rgba(255,255,255,.35); }
  .reply { font-size: var(--font-text-xs-size); color: var(--color-text-tertiary); margin: 0 12px 2px; }
  .tapback {
    font-size: var(--font-text-sm-size); color: var(--color-text-secondary);
    padding: 3px 10px; border-radius: 14px;
    background: var(--color-background-secondary);
    border: 1px solid var(--color-border-secondary);
  }
  .stamp { font-size: var(--font-text-xs-size); color: var(--color-text-tertiary); margin: 3px 12px 0; }
  .att {
    display: inline-flex; align-items: center; gap: 6px; margin-top: 3px;
    padding: 4px 9px; max-width: 100%;
    border: 1px solid var(--color-border-primary); border-radius: var(--border-radius-full);
    font-size: var(--font-text-xs-size); color: var(--color-text-secondary);
    background: var(--color-background-secondary);
  }
  .att svg { width: 12px; height: 12px; flex: none; color: var(--color-text-tertiary); }
  .att .name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 220px; color: var(--color-text-primary); }
  .att .size { color: var(--color-text-tertiary); }
  mark { background: var(--mark); color: inherit; border-radius: 2px; padding: 0 1px; }

  /* ---- Rows (search hits, conversations) --------------------------- */
  .rows { display: flex; flex-direction: column; }
  .row {
    display: grid; grid-template-columns: 40px 1fr auto; column-gap: 12px;
    padding: 10px 16px; align-items: center;
  }
  .row + .row { border-top: 1px solid var(--color-border-secondary); }
  .row .avatar { grid-row: span 2; }
  .row .name {
    font-weight: var(--font-weight-semibold); font-size: var(--font-text-md-size); min-width: 0;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .row .name .ctx { font-weight: var(--font-weight-normal); color: var(--color-text-secondary); }
  .row .when { font-size: var(--font-text-sm-size); color: var(--color-text-secondary); white-space: nowrap; }
  .row .snippet {
    grid-column: 2 / 4; color: var(--color-text-secondary); font-size: var(--font-text-sm-size);
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
    margin-top: 1px; overflow-wrap: anywhere;
  }
  .row .snippet .muted { color: var(--color-text-tertiary); }
  .dot {
    display: inline-block; width: 8px; height: 8px; border-radius: 50%;
    background: var(--bubble-sms); margin-right: 6px; vertical-align: 1px;
  }

  /* ---- Details (single message) ------------------------------------ */
  .details {
    margin: 0 16px 12px; padding: 8px 10px;
    background: var(--color-background-secondary);
    border-radius: var(--border-radius-md);
    font-size: var(--font-text-sm-size);
    display: grid; grid-template-columns: max-content 1fr; gap: 3px 10px;
  }
  .details dt { color: var(--color-text-tertiary); margin: 0; }
  .details dd { margin: 0; overflow-wrap: anywhere; }
  .details .dim { color: var(--color-text-tertiary); }

  /* ---- Footer / actions --------------------------------------------- */
  .ftr {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 8px 16px 10px; border-top: 1px solid var(--color-border-secondary);
    background: var(--color-background-secondary);
  }
  .btn {
    appearance: none; border: 1px solid var(--color-border-primary);
    background: var(--color-background-primary); color: var(--color-text-primary);
    border-radius: var(--border-radius-md); padding: 6px 12px;
    font: inherit; font-size: var(--font-text-sm-size); font-weight: var(--font-weight-medium);
    cursor: pointer; display: inline-flex; align-items: center; gap: 6px;
    box-shadow: var(--shadow-sm);
  }
  .btn:hover { background: var(--color-background-tertiary); }
  .btn:focus-visible { outline: 2px solid var(--color-ring-primary); outline-offset: 1px; }
  .btn.ghost { border-color: transparent; background: transparent; box-shadow: none; color: var(--color-text-secondary); }
  .btn.ghost:hover { background: var(--color-background-tertiary); color: var(--color-text-primary); }
  .spacer { flex: 1 1 auto; }
  .footnote { color: var(--color-text-tertiary); font-size: var(--font-text-xs-size); }

  /* ---- States ------------------------------------------------------- */
  .state { padding: 16px; color: var(--color-text-secondary); font-size: var(--font-text-sm-size); }
  .state.error { color: var(--color-text-danger); background: var(--color-background-danger); white-space: pre-wrap; }
  .empty { padding: 26px 16px; text-align: center; color: var(--color-text-tertiary); font-size: var(--font-text-sm-size); }
  .skel { height: 12px; border-radius: 6px; background: var(--color-background-tertiary); margin: 8px 0; animation: pulse 1.4s ease-in-out infinite; }
  .skel.w40 { width: 40%; } .skel.w70 { width: 70%; } .skel.w90 { width: 90%; }
  @keyframes pulse { 0%, 100% { opacity: 0.55; } 50% { opacity: 1; } }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>
<div class="card" id="card">
  <div id="loading" class="state" aria-live="polite">
    <div class="skel w40"></div>
    <div class="skel w70"></div>
    <div class="skel w90"></div>
    <span class="sr">Loading messages</span>
  </div>
  <div id="error" class="state error" hidden></div>
  <div id="content" hidden>
    <div class="hdr" id="hdr"></div>
    <div class="body-wrap" id="bodyWrap">
      <div class="body" id="body"></div>
    </div>
    <div class="ftr" id="ftr">
      <button class="btn ghost" id="moreBtn" type="button" hidden>Show all</button>
      <span class="spacer"></span>
      <span class="footnote" id="footnote"></span>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  // ====================================================================
  // JSON-RPC over postMessage (View side of the MCP Apps protocol)
  // ====================================================================
  var PROTOCOL_VERSION = "2026-01-26";
  var APP_INFO = { name: "Apple Messages Message Preview", version: "1.0.0" };
  var ICON = "__ICON_DATA_URI__";
  var nextId = 1;
  var pending = new Map();
  var hostContext = {};
  var toolName = null;
  var toolArgs = {};

  function post(msg) { window.parent.postMessage(msg, "*"); }
  function request(method, params) {
    return new Promise(function (resolve, reject) {
      var id = nextId++;
      pending.set(id, { resolve: resolve, reject: reject });
      post({ jsonrpc: "2.0", id: id, method: method, params: params || {} });
    });
  }
  function notify(method, params) { post({ jsonrpc: "2.0", method: method, params: params || {} }); }
  function respond(id, result) { post({ jsonrpc: "2.0", id: id, result: result }); }
  function respondError(id, code, message) { post({ jsonrpc: "2.0", id: id, error: { code: code, message: message } }); }

  window.addEventListener("message", function (ev) {
    if (ev.source !== window.parent) return;
    var m = ev.data;
    if (!m || m.jsonrpc !== "2.0") return;
    if (m.method === undefined && m.id !== undefined) {           // response to us
      var p = pending.get(m.id);
      if (!p) return;
      pending.delete(m.id);
      if (m.error) p.reject(m.error); else p.resolve(m.result);
      return;
    }
    if (m.id !== undefined) handleRequest(m); else handleNotification(m);
  });

  function handleRequest(m) {
    switch (m.method) {
      case "ping":
      case "ui/resource-teardown":
        respond(m.id, {}); break;
      default:
        respondError(m.id, -32601, "Method not found: " + m.method);
    }
  }

  function handleNotification(m) {
    var p = m.params || {};
    switch (m.method) {
      case "ui/notifications/tool-input":
      case "ui/notifications/tool-input-partial":
        toolArgs = p.arguments || {}; break;
      case "ui/notifications/tool-result":
        onToolResult(p); break;
      case "ui/notifications/tool-cancelled":
        showError("Preview cancelled" + (p.reason ? ": " + p.reason : ".")); break;
      case "ui/notifications/host-context-changed":
        applyHostContext(Object.assign(hostContext, p)); break;
      default: break;
    }
  }

  function connect() {
    request("ui/initialize", {
      appInfo: APP_INFO,
      appCapabilities: { availableDisplayModes: ["inline"] },
      protocolVersion: PROTOCOL_VERSION
    }).then(function (result) {
      result = result || {};
      hostContext = result.hostContext || {};
      applyHostContext(hostContext);
      notify("ui/notifications/initialized", {});
      startSizeReporting();
    }).catch(function (err) {
      console.error("ui/initialize failed", err);
      startSizeReporting();
    });
  }

  // ====================================================================
  // Host context: theme, style variables, fonts, dimensions
  // ====================================================================
  function applyHostContext(ctx) {
    var root = document.documentElement;
    if (ctx.theme === "light" || ctx.theme === "dark") root.setAttribute("data-theme", ctx.theme);
    if (ctx.styles && ctx.styles.variables) {
      Object.keys(ctx.styles.variables).forEach(function (k) {
        var v = ctx.styles.variables[k];
        if (/^--[a-z0-9-]+$/i.test(k) && typeof v === "string") root.style.setProperty(k, v);
      });
    }
    if (ctx.styles && ctx.styles.css && typeof ctx.styles.css.fonts === "string") {
      var el = document.getElementById("hostFonts");
      if (!el) { el = document.createElement("style"); el.id = "hostFonts"; document.head.appendChild(el); }
      el.textContent = ctx.styles.css.fonts;
    }
    if (ctx.toolInfo && ctx.toolInfo.tool && ctx.toolInfo.tool.name) toolName = ctx.toolInfo.tool.name;
    var dims = ctx.containerDimensions;
    if (dims) {
      root.style.height = ("height" in dims) ? "100vh" : "";
      root.style.maxHeight = (!("height" in dims) && dims.maxHeight) ? dims.maxHeight + "px" : "";
      root.style.overflowY = (("height" in dims) || dims.maxHeight) ? "auto" : "";
      root.style.width = ("width" in dims) ? "100vw" : "";
      root.style.maxWidth = (!("width" in dims) && dims.maxWidth) ? dims.maxWidth + "px" : "";
    }
    if (ctx.safeAreaInsets) {
      var s = ctx.safeAreaInsets;
      document.body.style.padding = (s.top|0) + "px " + (s.right|0) + "px " + (s.bottom|0) + "px " + (s.left|0) + "px";
    }
  }

  var lastW = -1, lastH = -1;
  // Synchronous on purpose: ResizeObserver already coalesces per frame, and a
  // requestAnimationFrame here would stall while the iframe is off-screen or
  // the host tab is hidden, leaving the frame at a stale height.
  function reportSize() {
    decideCollapse();
    var card = document.getElementById("card");
    var h = Math.ceil(card.getBoundingClientRect().height + bodyPad("Top") + bodyPad("Bottom"));
    var w = Math.ceil(document.documentElement.getBoundingClientRect().width);
    if (!h) return;                                    // display:none, nothing to say
    // Past the host's ceiling the document scrolls internally; don't ask
    // for more than it will give.
    var dims = hostContext.containerDimensions || {};
    if (!("height" in dims) && dims.maxHeight) h = Math.min(h, dims.maxHeight);
    if (h === lastH && w === lastW) return;
    lastH = h; lastW = w;
    notify("ui/notifications/size-changed", { width: w, height: h });
  }
  function bodyPad(side) { return parseFloat(getComputedStyle(document.body)["padding" + side]) || 0; }
  function startSizeReporting() {
    if (window.ResizeObserver) {
      var ro = new ResizeObserver(reportSize);
      ro.observe(document.documentElement);
      ro.observe(document.body);
      ro.observe(document.getElementById("card"));
    }
    reportSize();
  }

  // ====================================================================
  // Rendering
  // ====================================================================
  var $ = function (id) { return document.getElementById(id); };
  function esc(s) {
    return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
      return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c];
    });
  }
  function textOf(content) {
    if (!Array.isArray(content)) return "";
    return content.filter(function (c) { return c && c.type === "text"; })
                  .map(function (c) { return c.text; }).join("\n");
  }

  function showError(text) {
    $("loading").hidden = true;
    $("content").hidden = true;
    var e = $("error"); e.textContent = text; e.hidden = false;
    reportSize();
  }

  function showContent(hdrHTML, bodyHTML, footnote, opts) {
    opts = opts || {};
    $("loading").hidden = true;
    $("error").hidden = true;
    $("hdr").innerHTML = hdrHTML;
    var body = $("body"), wrap = $("bodyWrap");
    body.className = "body";
    wrap.className = "body-wrap";
    body.innerHTML = bodyHTML;
    $("footnote").textContent = footnote || "";
    var more = $("moreBtn"), ftr = $("ftr");
    more.hidden = true;
    // No footnote and nothing to expand: drop the bar rather than show it empty.
    ftr.hidden = !footnote;
    $("content").hidden = false;
    if (opts.collapsible === false) {
      body.classList.add("expanded");
      pendingCollapse = null;
    } else {
      pendingCollapse = function () {
        // Reading scrollHeight forces layout, so this measures synchronously.
        if (body.scrollHeight > body.clientHeight + 40) {
          wrap.classList.add("overflows");
          more.hidden = false;
          ftr.hidden = false;
          more.textContent = opts.moreLabel || "Show all";
          more.onclick = function () {
            body.classList.add("expanded");
            wrap.classList.add("expanded-wrap");
            more.hidden = true;
            ftr.hidden = !footnote;
            reportSize();
          };
        } else {
          body.classList.add("expanded");
        }
      };
    }
    decideCollapse();
    reportSize();
  }

  // Whether a transcript needs a "Show all" fold depends on how the text
  // wraps, and a frame that has not been laid out yet (hidden tab, iframe
  // still at zero size) wraps every word onto its own line and looks miles
  // tall. So the decision waits for a real width; the ResizeObserver path
  // through reportSize() retries it once the frame has one.
  var pendingCollapse = null;
  function decideCollapse() {
    if (!pendingCollapse || !document.documentElement.clientWidth) return;
    var decide = pendingCollapse;
    pendingCollapse = null;
    decide();
  }

  // ---- Shared helpers (initials, colours, dates: same as the Mail card) ----
  function initials(s) {
    s = String(s || "").replace(/["']/g, "").trim();
    if (!s) return "?";
    if (/^[+\d(]/.test(s)) return "#";
    if (s.indexOf("@") !== -1 && s.indexOf(" ") === -1) return s[0].toUpperCase();
    var parts = s.split(/\s+/).filter(Boolean);
    return ((parts[0] || "")[0] + ((parts.length > 1 ? parts[parts.length - 1] : "")[0] || "")).toUpperCase();
  }
  var PALETTE = ["#d95f5f", "#dd8a3b", "#c9a227", "#5aa35a", "#3f9f8f", "#4a8fdc", "#6a6fdc", "#a05fd9", "#d15fa9", "#7f8a99"];
  function avatarColor(key) {
    var h = 0; key = String(key || "").toLowerCase();
    for (var i = 0; i < key.length; i++) h = (h * 31 + key.charCodeAt(i)) >>> 0;
    return PALETTE[h % PALETTE.length];
  }
  function fmt(d, opts) {
    var loc = hostContext.locale || undefined;
    var tz = hostContext.timeZone || undefined;
    try { return new Intl.DateTimeFormat(loc, Object.assign({ timeZone: tz }, opts)).format(d); }
    catch (e) { return d.toLocaleString(); }
  }
  function parse(iso) { if (!iso) return null; var d = new Date(iso); return isNaN(d.getTime()) ? null : d; }
  function formatDate(iso, full) {
    var d = parse(iso);
    if (!d) return "";
    if (full) return fmt(d, { dateStyle: "full", timeStyle: "short" });
    var now = new Date();
    var sameDay = dayKey(d) === dayKey(now);
    var sameYear = d.getFullYear() === now.getFullYear();
    if (sameDay) return fmt(d, { timeStyle: "short" });
    if (sameYear) return fmt(d, { month: "short", day: "numeric", hour: "numeric", minute: "2-digit" });
    return fmt(d, { dateStyle: "medium" });
  }
  function dayKey(d) { return fmt(d, { year: "numeric", month: "numeric", day: "numeric" }); }
  function dayLabel(d) {
    var now = new Date();
    var k = dayKey(d);
    if (k === dayKey(now)) return "Today";
    if (k === dayKey(new Date(now.getTime() - 864e5))) return "Yesterday";
    var sameYear = d.getFullYear() === now.getFullYear();
    return fmt(d, sameYear ? { weekday: "short", month: "short", day: "numeric" } : { month: "short", day: "numeric", year: "numeric" });
  }
  function timeLabel(d) { return fmt(d, { timeStyle: "short" }); }
  function formatBytes(n) {
    n = Number(n) || 0;
    if (n < 1024) return n + " B";
    if (n < 1024 * 1024) return (n / 1024).toFixed(n < 10240 ? 1 : 0) + " KB";
    return (n / (1024 * 1024)).toFixed(1) + " MB";
  }
  function prettyHandle(h) {
    if (!h) return "";
    var m = String(h).match(/^\+1(\d{3})(\d{3})(\d{4})$/);
    return m ? "(" + m[1] + ") " + m[2] + "-" + m[3] : h;
  }
  function who(m) { return m.is_from_me ? "You" : (m.sender_name || prettyHandle(m.sender) || "Unknown"); }
  function svc(s) { return String(s || "").toLowerCase(); }
  function svcTag(s) { return s ? '<span class="tag ' + esc(svc(s)) + '">' + esc(s) + "</span>" : ""; }
  function plural(n, word) { return n + " " + word + (n === 1 ? "" : "s"); }

  var ICONS = {
    clip: '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true"><path d="M10.5 5.5 6 10a1.8 1.8 0 0 0 2.5 2.5l4.6-4.6a3.2 3.2 0 0 0-4.5-4.5L3.9 8.1a4.4 4.4 0 0 0 6.2 6.2l3.4-3.4"/></svg>',
    group: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="9" cy="8" r="3.2"/><circle cx="16.5" cy="9" r="2.6"/><path d="M2.5 18.5c0-3.3 2.9-5.5 6.5-5.5s6.5 2.2 6.5 5.5v.5h-13z"/><path d="M15.8 14.2c.6-.1 1-.2 1.5-.2 2.7 0 4.7 1.6 4.7 4v1h-4.5v-.5c0-1.6-.6-3.1-1.7-4.3z"/></svg>',
    person: '<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 20c0-4 3.6-6.5 8-6.5s8 2.5 8 6.5v.5H4z"/></svg>',
    search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6"/><path d="m15 15 5 5"/></svg>',
    list: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M5 7h14M5 12h14M5 17h9"/></svg>'
  };
  var TAPBACK = { loved: "❤️", liked: "👍", disliked: "👎", laughed: "😂", emphasized: "‼️", questioned: "❓", reacted: "💬", sticker: "🩵" };

  function avatarHTML(opts) {
    // opts: {text, key, icon, me, neutral}
    var cls = "avatar" + (opts.me ? " me" : "") + (opts.neutral ? " neutral" : "");
    var style = (!opts.me && !opts.neutral) ? ' style="--avatar-bg:' + avatarColor(opts.key || opts.text) + '"' : "";
    var inner = opts.icon ? ICONS[opts.icon] : esc(opts.text);
    return '<div class="' + cls + '"' + style + ' aria-hidden="true">' + inner + "</div>";
  }
  function personAvatar(name, handle, me) {
    if (me) return avatarHTML({ text: "You", me: true });
    var ini = initials(name || handle);
    if (ini === "#" || ini === "?") return avatarHTML({ icon: "person", key: handle || name });
    return avatarHTML({ text: ini, key: handle || name });
  }
  function headerHTML(avatar, title, sub, right) {
    return avatar +
      '<div class="who"><div class="title">' + title + "</div>" +
      (sub ? '<div class="sub">' + sub + "</div>" : "") + "</div>" +
      (right ? '<div class="meta">' + right + "</div>" : "");
  }

  function highlight(text, needle) {
    if (!text) return "";
    if (!needle) return esc(text);
    var lower = text.toLowerCase(), n = needle.toLowerCase();
    var out = "", i = 0, j;
    while ((j = lower.indexOf(n, i)) !== -1) {
      out += esc(text.slice(i, j)) + "<mark>" + esc(text.slice(j, j + n.length)) + "</mark>";
      i = j + n.length;
    }
    return out + esc(text.slice(i));
  }

  // ---- Views -----------------------------------------------------------
  function attachmentChips(m) {
    if (!m.has_attachments) return "";
    var list = Array.isArray(m.attachments) && m.attachments.length ? m.attachments : [null];
    return list.map(function (a) {
      var name = a ? (a.transfer_name || String(a.filename || "").split("/").pop() || "Attachment") : "Attachment";
      var size = a && a.size ? '<span class="size">' + esc(formatBytes(a.size)) + "</span>" : "";
      return '<span class="att">' + ICONS.clip + '<span class="name">' + esc(name) + "</span>" + size + "</span>";
    }).join("");
  }

  function bubbleHTML(m, needle) {
    if (m.tapback) {
      var emoji = TAPBACK[m.tapback] || "💬";
      var verb = m.tapback === "reacted" ? "reacted to" : m.tapback;
      return '<div class="tapback">' + emoji + " " + esc(who(m)) + " " + esc(verb) + " a message</div>";
    }
    if (m.is_unsent || (!m.text && !m.has_attachments)) {
      return '<div class="bubble unsent">' + (m.is_unsent ? "Message unsent" : "Message with no text") + "</div>";
    }
    var html = m.text ? '<div class="bubble">' + highlight(m.text, needle) + "</div>" : "";
    return html + attachmentChips(m);
  }

  function transcriptHTML(messages, needle, showSenders) {
    if (!messages.length) return '<div class="empty">No messages</div>';
    var sorted = messages.slice().sort(function (a, b) { return (parse(a.date) || 0) - (parse(b.date) || 0); });
    var html = '<div class="transcript">', lastDay = null, prev = null;
    sorted.forEach(function (m, idx) {
      var d = parse(m.date), pd = prev ? parse(prev.date) : null;
      var next = sorted[idx + 1], nd = next ? parse(next.date) : null;
      if (d && dayKey(d) !== lastDay) {
        lastDay = dayKey(d);
        html += '<div class="day"><b>' + esc(dayLabel(d)) + "</b> " + esc(timeLabel(d)) + "</div>";
        prev = null; pd = null;
      }
      var sameRun = !!(prev && prev.is_from_me === m.is_from_me && prev.sender === m.sender && d && pd && (d - pd) < 5 * 60e3);
      var endsRun = !next || next.is_from_me !== m.is_from_me || next.sender !== m.sender ||
        !d || !nd || (nd - d) >= 5 * 60e3 || dayKey(nd) !== lastDay;
      var cls = ["msg", m.is_from_me ? "out" : "in", svc(m.service), sameRun ? "" : "gap", endsRun ? "last" : ""].join(" ");
      html += '<div class="' + cls + '">';
      // A tapback pill already names who reacted, so it needs no sender label.
      if (showSenders && !m.is_from_me && !sameRun && !m.tapback) html += '<div class="sender">' + esc(who(m)) + "</div>";
      if (m.reply_to_guid && !m.tapback) html += '<div class="reply">↩︎ Reply</div>';
      html += bubbleHTML(m, needle);
      var flags = [];
      if (m.is_edited) flags.push("Edited");
      if (endsRun && d && !m.tapback) flags.push(timeLabel(d));
      if (flags.length) html += '<div class="stamp">' + esc(flags.join(" · ")) + "</div>";
      html += "</div>";
      prev = m;
    });
    return html + "</div>";
  }

  // Direct chats carry an empty chat_name (COALESCE picks up a blank display
  // name), so fall back to whoever is on the other end.
  function otherParty(msgs) {
    for (var i = 0; i < msgs.length; i++) if (!msgs[i].is_from_me && (msgs[i].sender_name || msgs[i].sender)) return msgs[i];
    return null;
  }
  function transcriptTitle(msgs) {
    for (var i = 0; i < msgs.length; i++) if (msgs[i].chat_name) return prettyHandle(msgs[i].chat_name);
    var o = otherParty(msgs);
    return o ? who(o) : "Conversation";
  }

  function renderTranscript(msgs, o) {
    // o: {sub, needle, truncated}
    var senders = {};
    msgs.forEach(function (m) { if (!m.is_from_me && m.sender) senders[m.sender] = m.sender_name || prettyHandle(m.sender); });
    var handles = Object.keys(senders);
    var group = handles.length > 1;
    var other = otherParty(msgs);
    var avatar = group ? avatarHTML({ icon: "group", key: msgs[0].chat_id != null ? "chat" + msgs[0].chat_id : "" })
                       : personAvatar(other && other.sender_name, other && other.sender, !other);
    var sub = o.sub || (group ? handles.map(function (h) { return senders[h]; }).join(", ") : (other && other.sender_name ? prettyHandle(other.sender) : ""));
    var latest = msgs.reduce(function (acc, m) { var d = parse(m.date); return d && (!acc || d > acc) ? d : acc; }, null);
    var right = (latest ? '<span class="date" title="' + esc(formatDate(latest.toISOString(), true)) + '">' + esc(formatDate(latest.toISOString())) + "</span>" : "") + svcTag(msgs[0].service);
    var note = plural(msgs.length, "message") + (o.truncated ? " · more not shown" : "");
    showContent(headerHTML(avatar, esc(transcriptTitle(msgs)), esc(sub), right), transcriptHTML(msgs, o.needle, group), note);
  }

  function renderHits(msgs, query, truncated) {
    var title = query ? "“" + esc(query) + "”" : "Messages";
    var sub = plural(msgs.length, "result") + (truncated ? " · more available" : "") + " · across conversations";
    var hdr = headerHTML(avatarHTML({ icon: "search", neutral: true }), title, esc(sub), "");
    if (!msgs.length) {
      showContent(hdr, '<div class="empty">No messages' + (query ? " match “" + esc(query) + "”" : "") + "</div>", "", { collapsible: false });
      return;
    }
    var sorted = msgs.slice().sort(function (a, b) { return (parse(b.date) || 0) - (parse(a.date) || 0); });
    var rows = sorted.map(function (m) {
      var name = who(m);
      var chat = m.chat_name && m.chat_name !== m.sender && m.chat_name !== m.sender_name ? prettyHandle(m.chat_name) : "";
      var text = m.tapback ? (TAPBACK[m.tapback] || "💬") + " " + m.tapback + " a message"
        : m.is_unsent ? "Message unsent" : (m.text || (m.has_attachments ? "📎 Attachment" : ""));
      return '<div class="row">' +
        personAvatar(m.sender_name, m.sender, m.is_from_me) +
        '<div class="name">' + esc(name) + (chat ? ' <span class="ctx">in ' + esc(chat) + "</span>" : "") + "</div>" +
        '<div class="when" title="' + esc(formatDate(m.date, true)) + '">' + esc(formatDate(m.date)) + "</div>" +
        '<div class="snippet">' + (m.tapback || m.is_unsent ? esc(text) : highlight(text, query)) + "</div>" +
        "</div>";
    }).join("");
    showContent(hdr, '<div class="rows">' + rows + "</div>", "Apple Messages");
  }

  function chatTitle(c) {
    if (c.display_name) return c.display_name;
    var names = (c.contact_names || []).filter(Boolean);
    if (names.length) return names.join(", ");
    var parts = (c.participants || []).map(prettyHandle);
    return parts.length ? parts.join(", ") : prettyHandle(c.identifier);
  }

  function renderChats(chats) {
    var hdr = headerHTML(avatarHTML({ icon: "list", neutral: true }), "Conversations",
      esc(plural(chats.length, "conversation") + " · most recent first"), "");
    if (!chats.length) {
      showContent(hdr, '<div class="empty">No conversations</div>', "", { collapsible: false });
      return;
    }
    var rows = chats.map(function (c) {
      var title = chatTitle(c);
      var s = svc(c.service);
      var avatar = c.is_group ? avatarHTML({ icon: "group", key: c.guid || c.identifier })
                              : personAvatar((c.contact_names || [])[0], (c.participants || [])[0] || c.identifier, false);
      var non = s && s !== "imessage" ? '<span class="dot" title="' + esc(c.service) + '"></span>' : "";
      var preview = c.last_message_preview ? esc(c.last_message_preview)
        : '<span class="muted">' + esc(plural(c.message_count || 0, "message")) + "</span>";
      return '<div class="row">' + avatar +
        '<div class="name">' + non + esc(title) + "</div>" +
        '<div class="when" title="' + esc(formatDate(c.last_message_date, true)) + '">' + esc(formatDate(c.last_message_date)) + "</div>" +
        '<div class="snippet">' + preview + "</div>" +
        "</div>";
    }).join("");
    showContent(hdr, '<div class="rows">' + rows + "</div>", "Apple Messages");
  }

  function renderDetail(m) {
    var chat = m.chat_name ? prettyHandle(m.chat_name) : "";
    var name = who(m);
    var sub = m.is_from_me ? (chat ? "to " + chat : "") : [m.sender_name ? prettyHandle(m.sender) : "", chat && chat !== name ? "in " + chat : ""].filter(Boolean).join(" · ");
    var right = '<span class="date" title="' + esc(formatDate(m.date, true)) + '">' + esc(formatDate(m.date)) + "</span>" + svcTag(m.service);
    var hdr = headerHTML(personAvatar(m.sender_name, m.sender, m.is_from_me), esc(name), esc(sub), right);

    var dl = [];
    function add(k, v) { if (v) dl.push("<dt>" + esc(k) + "</dt><dd>" + v + "</dd>"); }
    add("Sent", esc(formatDate(m.date, true)));
    add("Delivered", esc(formatDate(m.date_delivered, true)));
    add("Read", m.date_read ? esc(formatDate(m.date_read, true)) : (m.is_from_me ? "" : (m.is_read ? "Yes" : "No")));
    if (m.is_edited) add("Edited", "Yes");
    if (m.reply_to_guid) add("Reply", "In a thread");
    if (Array.isArray(m.attachments) && m.attachments.length) {
      add("Attachments", m.attachments.map(function (a) {
        var n = a.transfer_name || String(a.filename || "").split("/").pop() || "Attachment";
        var extra = [a.mime_type, a.size ? formatBytes(a.size) : ""].filter(Boolean).join(" · ");
        return esc(n) + (extra ? ' <span class="dim">· ' + esc(extra) + "</span>" : "");
      }).join("<br>"));
    }
    var body = transcriptHTML([m], null, false) + (dl.length ? '<dl class="details">' + dl.join("") + "</dl>" : "");
    showContent(hdr, body, "Apple Messages", { collapsible: false });
  }

  // ---- Dispatch --------------------------------------------------------
  function onToolResult(result) {
    if (result.isError) {
      showError(textOf(result.content) || "The messages could not be loaded.");
      return;
    }
    var data = result.structuredContent;
    if (data === undefined || data === null) {
      try { data = JSON.parse(textOf(result.content)); } catch (e) { data = null; }
    }
    // The SDK wraps list results as {"result": [...]}.
    if (data && typeof data === "object" && !Array.isArray(data) && "result" in data && Object.keys(data).length === 1) data = data.result;
    if (data == null) { showError("No message data in the tool result."); return; }

    try {
      var isList = Array.isArray(data);
      var first = isList ? data[0] : null;
      var kind =
        toolName === "list_chats" || (isList && first && "participants" in first) ? "chats" :
        toolName === "get_message" || (!isList && "attachments" in data) ? "detail" :
        toolName === "search_messages" || (!isList && Array.isArray(data.messages)) ? "search" :
        isList ? "transcript" : "unknown";

      if (kind === "chats") return renderChats(data);
      if (kind === "detail") return renderDetail(data);
      if (kind === "search") {
        var msgs = data.messages || [];
        if (toolArgs.chat_id != null && msgs.length) {
          return renderTranscript(msgs, { sub: data.query ? "Matching “" + data.query + "”" : "Newest first", needle: data.query, truncated: data.truncated });
        }
        return renderHits(msgs, data.query, data.truncated);
      }
      if (kind === "transcript") {
        if (!data.length) {
          showContent(headerHTML(avatarHTML({ icon: "person", neutral: true }), "Conversation", "", ""), '<div class="empty">No messages</div>', "", { collapsible: false });
          return;
        }
        return renderTranscript(data, {});
      }
      showError("Unrecognised result:\n" + JSON.stringify(data, null, 2).slice(0, 2000));
    } catch (err) {
      showError("Could not render this result: " + (err && err.message || err));
    }
  }

  connect();
})();
</script>
</body>
</html>
