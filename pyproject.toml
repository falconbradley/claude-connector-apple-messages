[project]
name = "apple-messages-mcp"
version = "0.1.0"
description = "MCP server for Apple Messages on macOS — read iMessage, SMS, and RCS via chat.db"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mcp[cli]>=1.3.0",
    "pydantic>=2.0.0",
]

[project.scripts]
apple-messages-mcp = "apple_messages_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apple_messages_mcp"]

[tool.uv]
dev-dependencies = []
